[project]
name = "llb-accountant-api"
version = "0.1.0"
description = "FastAPI Cloud backend for the LLB Accountant application"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0,<1",
    "bcrypt>=4.2.0,<6",
    "fastapi[standard]>=0.115.0,<1",
]

[tool.fastapi]
entrypoint = "main:app"

